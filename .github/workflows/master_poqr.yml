name: Build and deploy ASP.Net Core app to Azure Web App - poqr

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Azure OIDC credentials — rename these secrets to AZURE_CLIENT_ID /
# AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID and update the values below
# once the old auto-generated secrets have been replaced.
env:
  AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7785DF056FD348D493EA0655CDED4CBB }}
  AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_8A60F6B7A67D4012A87E345BF23C25BB }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B813E682DE5744C394E3C037F984DE23 }}

jobs:
  # Deploys Bicep infrastructure (idempotent — safe to run on every push).
  # Runs in parallel with the build job.
  infra:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep infrastructure
        run: |
          az deployment sub create \
            --name poqr-infra \
            --location westeurope \
            --template-file infra/main.bicep

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/Poker.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Poker.Web
        run: npm ci

      - name: Build frontend
        working-directory: src/Poker.Web
        run: npm run build

      - name: Publish backend
        run: dotnet publish src/Poker.Api/Poker.Api.csproj -c Release -o "$RUNNER_TEMP/poqr-publish"

      - name: Package frontend with backend
        run: |
          rm -rf "$RUNNER_TEMP/poqr-publish/publish" "$RUNNER_TEMP/poqr-publish/out"
          rm -rf "$RUNNER_TEMP/poqr-publish/wwwroot"/*
          cp -r src/Poker.Web/dist/poker-web/browser/. "$RUNNER_TEMP/poqr-publish/wwwroot/"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/poqr-publish

  deploy:
    runs-on: ubuntu-latest
    needs: [infra, build]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/poqr-publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'poqr'
          slot-name: 'Production'
          package: ${{ runner.temp }}/poqr-publish
          